<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 图标背景：翠绿渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6cc788"/>
      <stop offset="100%" stop-color="#52a86d"/>
    </linearGradient>
    <!-- 当前时刻光晕 -->
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 大圆点渐变（微立体感） -->
    <radialGradient id="dotGrad" cx="0.35" cy="0.32" r="0.65">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F5F2"/>
    </radialGradient>
  </defs>

  <!-- 外层容器 -->
  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#bgGrad)"/>

  <!-- 时间轴主线 -->
  <line x1="128" y1="58" x2="128" y2="198" 
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.28"/>

  <!-- 过去节点（小） -->
  <circle cx="128" cy="82" r="9" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="128" cy="82" r="4.5" fill="#FFFFFF" opacity="0.7"/>

  <!-- 中间节点（中） -->
  <circle cx="128" cy="128" r="13" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="128" cy="128" r="6.5" fill="#FFFFFF" opacity="0.85"/>

  <!-- 当前时刻（大 + 光晕） -->
  <circle cx="128" cy="176" r="34" fill="url(#glowGrad)"/>
  <circle cx="128" cy="176" r="19" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="128" cy="176" r="11" fill="url(#dotGrad)"/>

</svg>
